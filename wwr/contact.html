<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact information and form</title>
    <meta name="description"
      content="This webpage will include contact information and a contact form which the user can submit to ask questions about the company and its services.">
    <meta name="author" content="Trish Chibira">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting.png" alt="The website logo" width="250">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="company-details">
            <h1>White Water Rafting Company</h1>
            <address>
                123 Main River Street<br>
                Kolob,California<br>
                <a href="tel:+1999999999">+ 1 999 999 999</a><br>
                <a href="mail:info@whitewater.com">info@whitewater.com</a>

            </address>

        </section>
        <section class="info-content">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d49654.849838434835!2d-119.81389045715333!3d38.93704695542058!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8099bf64a5f90b83%3A0x33f6dbe1592b4677!2sThe%20UPS%20Store!5e0!3m2!1sen!2szw!4v1785591467110!5m2!1sen!2szw"
                  width="800" height="700" style="border:0;" allowfullscreen="" loading="lazy"
                  title="Company Location map"></iframe>
            </div>


            <form action="#" method="post" class="contact-info">
                <div class="formrow">
                    <label for="name" class="rows">Name</label>
                    <input type="text" id="name" placeholder="Type here" required>
                </div>
                <div class="formrow">
                    <label for="email" class="rows">Email</label>
                    <input type="email" id="email" placeholder="Type here" required>
                </div>


                <div class="formrow">
                    <label>Message<br>Purpose</label>
                    <div class="radios">
                        <label><input type="radio" name="answers" value="firstchoice"
                              checked>General Inquiry</label>
                        <label><input type="radio" name="answers" value="secondchoice">Reservation
                            Question</label>
                        <label><input type="radio" name="answers" value="thirdchoice">Website
                            Suggestion</label>
                    </div>
                </div>

                <div class="messagerow">
                    <label for="message" class="rows">Message</label>
                    <textarea id="message" name="message" rows="5"
                      placeholder="Write here"></textarea>
                </div>

                <label class="checking-boxes">
                    <input type="checkbox" name="monthly-news" checked>
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch</button>
            </form>
        </section>
        <section class="employees">
            <h2>We Are Here To Serve You</h2>
            <div class="employee-structure">
                <div class="employee">
                    <img src="images\employee1.avif" alt="Water Guide" width="250" height="250">
                    <p>Water Guide</p>

                </div>
                <div class="employee">
                    <img src="images\emloyee2.jpg" alt="Director" width="250" height="250">
                    <p>Director</p>


                </div>
                <div class="employee">
                    <img src="images\employee3.jpg" alt="manager" width="250" height="250">
                    <p>Manager</p>
                    </p>
                </div>
            </div>
        </section>


    </main>

    <footer>
        <p> ©️2026 💦 WhiteWater Rafting 💦 Trish Chibira</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>


    </footer>
</body>

</html>
